
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ShopDb
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopuser -d ShopDb"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m

  api:
    build:
      context: .
      dockerfile: src/Shop.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=ShopDb;Username=shopuser;Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
      Seed__SampleData: "false"
      Cors__AllowedOrigins__0: "http://205.252.135.50"
      Payment__CallbackBaseUrl: "http://205.252.135.50"
      Payment__FrontendResultUrl: "http://205.252.135.50/payment/result"
      Payment__DefaultGateway: "Fake"
      Payment__EnableFakeGateway: "true"
      Payment__ZarinPal__Enabled: "false"
      Payment__ZarinPal__Sandbox: "true"
      Swagger__Enabled: "false"
    volumes:
      - uploads:/app/wwwroot/uploads
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    mem_limit: 512m

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8080
      COOKIE_SECURE: "false"
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    mem_limit: 384m

volumes:
  postgres_data:
  uploads:
